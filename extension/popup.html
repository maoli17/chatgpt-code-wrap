<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 300px;
    padding: 20px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #1a1a1a;
    color: #e0e0e0;
  }
  .header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
  }
  .header-icon {
    width: 32px;
    height: 32px;
    background: rgba(16, 163, 127, 0.15);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .header-icon span { font-size: 18px; }
  .header-text h1 { font-size: 14px; font-weight: 600; color: #fff; }
  .header-text p { font-size: 11px; color: #888; margin-top: 2px; }
  .divider { height: 1px; background: #333; margin: 12px 0; }
  .info { font-size: 12px; color: #999; line-height: 1.6; }
  .info strong { color: #10a37f; }
  .sites {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin: 10px 0 2px;
  }
  .site {
    padding: 3px 8px;
    border-radius: 999px;
    background: #2a2a2a;
    color: #d8d8d8;
    font-size: 11px;
  }
  .pill-demo {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 1px 8px 1px 4px;
    border-radius: 999px;
    font-size: 11px;
    vertical-align: middle;
  }
  .pill-on { background: rgba(16, 163, 127, 0.15); color: #10a37f; }
  .pill-off { background: rgba(150, 150, 150, 0.15); color: #999; }
  .pill-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; }
  .pill-on .pill-dot { background: #10a37f; }
  .pill-off .pill-dot { background: #999; }
  .setting-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin: 14px 0 4px;
  }
  .setting-copy {
    min-width: 0;
  }
  .setting-title {
    display: block;
    color: #fff;
    font-size: 12px;
    font-weight: 600;
    line-height: 1.3;
  }
  .setting-detail {
    display: block;
    color: #888;
    font-size: 11px;
    line-height: 1.4;
    margin-top: 2px;
  }
  .switch {
    position: relative;
    display: inline-block;
    width: 42px;
    height: 24px;
    flex: 0 0 auto;
  }
  .switch input {
    opacity: 0;
    width: 0;
    height: 0;
  }
  .slider {
    position: absolute;
    cursor: pointer;
    inset: 0;
    background: #333;
    border-radius: 999px;
    transition: background 0.2s ease;
  }
  .slider::before {
    content: "";
    position: absolute;
    width: 18px;
    height: 18px;
    left: 3px;
    top: 3px;
    background: #aaa;
    border-radius: 50%;
    transition: transform 0.2s ease, background 0.2s ease;
  }
  .switch input:checked + .slider {
    background: rgba(16, 163, 127, 0.35);
  }
  .switch input:checked + .slider::before {
    transform: translateX(18px);
    background: #10a37f;
  }
  .switch input:focus-visible + .slider {
    outline: 2px solid #10a37f;
    outline-offset: 2px;
  }
  .footer { margin-top: 12px; font-size: 11px; color: #555; text-align: center; }
  .footer a { color: #10a37f; text-decoration: none; }
  .footer a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <div class="header">
    <div class="header-icon"><span>↩</span></div>
    <div class="header-text">
      <h1>Code Wrap Toggle</h1>
      <p id="version-display">v...</p>
    </div>
  </div>
  <div class="divider"></div>
  <div class="info">
    Supported code blocks on ChatGPT, Claude, and Gemini now have a <strong>Wrap</strong> button.
    <div class="sites">
      <span class="site">ChatGPT</span>
      <span class="site">Claude</span>
      <span class="site">Gemini</span>
    </div>
    <br>
    <span class="pill-demo pill-on"><span class="pill-dot"></span> Wrap</span>
    = lines wrap to fit the screen<br>
    <span class="pill-demo pill-off"><span class="pill-dot"></span> Wrap</span>
    = original horizontal scroll
  </div>
  <div class="divider"></div>
  <label class="setting-row">
    <span class="setting-copy">
      <span class="setting-title">Auto-wrap code blocks</span>
      <span class="setting-detail">Use wrap as the default on supported sites.</span>
    </span>
    <span class="switch">
      <input type="checkbox" id="auto-wrap-toggle">
      <span class="slider"></span>
    </span>
  </label>
  <div class="divider"></div>
  <div class="footer">
    <a href="https://github.com/maoli17/chatgpt-code-wrap" target="_blank">GitHub</a>
    &nbsp;·&nbsp;
    <a href="https://github.com/maoli17/chatgpt-code-wrap/issues" target="_blank">Report Bug</a>
  </div>
  <script src="popup.js"></script>
</body>
</html>
